{% extends 'base.html' %}
{% load static %}
{% block content %}
    <br><br>
    
    
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="row border rounded-5 p-3 bg-white shadow box-area">
        <div class="col-md-6 rounded-4 d-flex justify-content-center align-items-center flex-column left-box" style="background: #212529;">
            <div class="featured-image mb-3">
                <img src="{% static 'Logo_Koursero.png' %}" class="img-fluid" style="width: 250px;">
            </div>
            <p class="text-white fs-2" style="font-family: 'Courier New', Courier, monospace; font-weight: 600;">Koursero</p>
            <small class="text-white text-wrap text-center" style="width: 17rem;font-family: 'Courier New', Courier, monospace;">Select, Learn and Enjoy!</small>
        </div> 
        
        <div class="col-md-6 right-box">
            <div class="row align-items-center">
                <div class="header-text mb-4">
                    <br>
                    <h2>Register</h2>
                    <p>Create your account.</p>
                </div>

                <form method="POST" action="{% url 'register' %}">
                    {% csrf_token %}
                    {{ form.as_p }}
                                        
                    <div class="d-grid gap-2">
                        <button class="btn btn-dark" type="submit">Register</button>                        
                    </div>

                </form>
                
                <div class="row">                    
                    <small>Already have an account? <a href="{% url 'login' %}">Login</a></small>
                </div>
            </div>
        </div> 
    </div>
</div>



{% endblock %}
